<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Divs and Spans</title>
</head>
<body>
    <!-- <div> is a block-level container -->
    <div style=" background-color: #f0f0f0; padding: 20px;">
        <h2>About Me</h2>
        <!-- <span> is an inline container. -->
        <p>I am a develper based in <span style ="color : green; font-weight: bold;">Nairobi, Kenya</span>.</p>
        <p>I build web applications and <span style="color :blue;">mobile-friendly</span>experiences.</p>
    </div>

    <div style = "background-color: #e0e0e0; padding: 20px;">
        <h2>My Skills</h2>
        <p>HTML, CSS, and JavaScript.</p>
    </div>
</body>
</html>

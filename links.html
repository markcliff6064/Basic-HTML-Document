<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Links</title>
</head>
<body>
    <h1>Useful Websites</h1>
    <p>Check the latest news on <a href="https://www.nation.co.ke">Daily Nation</a>.</p>
    <p>Learn to code at <a href="https://academy.mctaba.com">Mctaba Academy</a>.</p>
    <!-- target="_blank" tells the browser to open the link in a new tab -->
    <p>Open Google in a new tab: <a href="https://www.google.com" target="_blank">Google Search</a>.</p>
    <!-- href="#contact" does not go to a different page, but jumps to an element with the specified ID -->
    <p>Jump to the <a href="#contact">contact section</a> below.</p>

    <h2 id="contact">Contact Us</h2>
    <p>Email us at info@example.com</p>
</body>
</html>
